intro: Everything in the store was given by someone like you. Each bag you bring gives our team work and gives a neighbor something good to find.
acceptedIntro: 'Most things in good condition, including:'
accepted:
- Clothing (ladies, men, kids)
- Shoes and boots
- Accessories
- Knick-knacks
- Tools
- Toys
- Kitchen items, dishes, cutlery
- Pet items
- Decor, pictures, art
- Holiday items
- Books and media
- Furniture
cannotTakeIntro: Some things don't sell, and some we can't legally accept. Our team knows the list, so please trust them at the door.
notAccepted:
- Live plants, car seats, cribs and bassinets
- Headboards, bed frames, mattresses and air mattresses
- Light fixtures (unless brand new), filing cabinets and clothing hangers
- Bulky kids toys, and toys that are worn or well used
- Kitchen appliances with food inside, and stained food containers
- Used scratching posts and pet beds
- Open or used cosmetics and sanitation items
- Fluorescent and long tube light bulbs
- Worn golf clubs, drawstring blinds, food, and personalized or promotional items
dropoff: Drive around to the back of the store at 2915 Pentagon Dr and follow the signs. We'll help you unload and give you a receipt.
doorTips:
- Bag clothing on its own, and keep shoes and linens separate.
- Pack hard items in sturdy boxes you don't need back.
- There's sometimes a line. Thanks for your patience.
pickupsPaused: true
pausedMessage: We've paused large-item pickups for now. Habitat for Humanity ReStore takes furniture and large items locally.
pausedLinkText: Donate to Habitat ReStore
pausedLinkUrl: https://restore.tchabitat.org/donate
pickup: '[Pickup details for when pickups resume: area served, how far ahead to book, and any fee.] Fill out the form below and our team will follow up to set a time.'
bulk: Moving, clearing an estate, or donating from a business? Please reach out before you load up so we can plan for a large drop-off.
whyDonate: Your things get a second life, and sorting and selling them is paid work for people rebuilding theirs. Along the way, we get to share the hope we have in Jesus.
taxNote: We're a 501(c)(3) nonprofit, so your donations are tax-deductible.
roundUp: You can still help by rounding up at the register.
faqs:
- q: Will I get a receipt for my donation?
  a: Yes. Our team gives you one when you drop off.
- q: Do you take exercise equipment?
  a: Sometimes. Space is limited, so we take one or two pieces at a time and prefer lighter items like stationary bikes, treadmills and rowing machines. Sporting goods sell best in spring and summer.
- q: Do you take books?
  a: Yes, if they're in decent shape, without heavy dust or mold.
- q: Can I bring something from the "can't take" list?
  a: Sometimes. Call us before you bring it in.
