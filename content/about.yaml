headline: Thrift store. Mission. Community.
intro: Hidden Treasures has served Minneapolis and the surrounding communities since 2008. We are a ministry of Masterworks of Minneapolis, which was founded in 1991.
story: 'Hidden Treasures exists to offer second chances. Through fair wages, job training and the Christian faith, we help people with barriers to employment become economically self-sufficient.


  Many of the people who work here have faced addiction, incarceration, poverty or homelessness. Some of us are in recovery and some are not. We work side by side, and we try to treat each other and our customers with dignity.


  When you donate a bag of clothes or buy a lamp, you help keep those jobs going.'
faith: We believe Jesus Christ changes lives. Our faith shapes how we work, how we treat each other, and how we welcome everyone who walks through our doors.
image: /images/uploads/checkout.jpg
mission: To provide economic self-sufficiency and life development skills to people with barriers to employment.
convictions:
- Every person has value
- Recovery and redemption are possible
- Work can be part of healing
- Jesus Christ changes lives
partnersNote: 'We partner with other ministries, in Minnesota and around the world, that work in recovery, education, mentoring and prayer.'
