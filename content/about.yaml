headline: Thrift store. Mission. Community.
intro: Since 2008, Hidden Treasures has served Minneapolis and the surrounding communities, offering far more than secondhand goods. We are a ministry of Masterworks of Minneapolis, founded in 1991.
story: 'Hidden Treasures exists to offer second chances. Through fair wages, job training and the Christian faith, we help people with barriers to employment become economically self-sufficient.


  Our team walks alongside people facing addiction, incarceration, poverty and homelessness. A job here comes with belonging, structure and room to grow. Some of us are in recovery and some are not, and all of us share a commitment to dignity, excellence and service.


  Every item you donate or buy, from clothing to furniture to household goods, is part of that story of recovery and restoration.'
faith: We believe Jesus Christ changes lives. Our faith shapes how we work, how we treat each other, and how we welcome everyone who walks through our doors.
image: /images/uploads/checkout.jpg
mission: To provide economic self-sufficiency and life development skills to people with barriers to employment.
convictions:
- Every person has value
- Recovery and redemption are possible
- Work can be part of healing
- Jesus Christ changes lives
partnersNote: 'We are glad to walk alongside ministries who share our vision, mission and values: people working for recovery, restoration and the hope of the gospel, in Minnesota and around the world.'
