intro: Hidden Treasures is one part of a wider family of ministries, in Minnesota and around the world. We share their vision for recovery, restoration and the hope of the gospel, and we are glad to walk alongside them.
note: This list is a starting point. To learn more, visit their websites or ask our leadership for more details.
items:
- name: Creation Stewards International
  url: https://www.creationstewardsint.org/
  description: An organization equipping and mobilizing people around the world to care for God's creation through sustainable agriculture, conservation, and environmental stewardship.
  focus: global
  logo: /images/partners/creation-stewards.png
  logoOnDark: false
- name: Jericho Road
  url: http://www.jerichoroad.us/
  description: A faith-based nonprofit that supports communities in crisis by providing transitional housing, addiction recovery programs, and other holistic services.
  focus: recovery
  logo: /images/partners/jericho-road.png
  logoOnDark: false
- name: Metro Hope Ministries
  url: https://www.metrohope.org/
  description: A residential, Christ-centered recovery program offering long-term support for men, women, and mothers with children seeking freedom from addiction.
  focus: recovery
  logo: /images/partners/metro-hope.png
  logoOnDark: false
- name: Hope Academy
  url: http://hopeacademympls.org/
  description: A private, faith-based school in Minneapolis providing high-quality, Christ-centered education to urban youth, making excellent education accessible to all families.
  focus: youth
  logo: /images/partners/hope-academy.png
  logoOnDark: false
- name: InnerChange
  url: https://icminneapolis.novo.org/
  description: A global network of Christian missionaries who live among and serve the poor, practicing incarnational ministry to bring hope and transformation.
  focus: global
  logo: /images/partners/innerchange.png
  logoOnDark: false
- name: Revive
  url: https://cityjoy.org/cityjoy-ministries-ministers/revive
  description: A ministry focused on uplifting urban youth through long-term, life-on-life mentoring relationships.
  focus: youth
  logo: /images/partners/revive.png
  logoOnDark: true
- name: Training Leaders International
  url: https://trainingleadersinternational.org/
  description: An organization dedicated to equipping pastors and church leaders worldwide with theological training, particularly in underserved areas.
  focus: global
  logo: /images/partners/training-leaders.svg
  logoOnDark: true
- name: The Steadfast Project
  url: https://tctnetwork.org/steadfastprayer
  description: A ministry that fosters a culture of prayer in cities, training and supporting leaders who are committed to intercessory prayer for their communities.
  focus: prayer
  logo: null
  logoOnDark: false
